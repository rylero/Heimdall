services:
  heimdall:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    runtime: nvidia
    privileged: true
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - GST_PLUGIN_PATH=/usr/local/lib/gstreamer-1.0-host
      - LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu/tegra:/usr/local/cuda/lib64
      - GST_DEBUG=*:2,v4l2bufferpool:1
    volumes:
      - ../models:/app/models
      - ../config:/app/config
      - heimdall-data:/app/data
      - ../logs:/app/logs
      - /usr/lib/aarch64-linux-gnu/gstreamer-1.0:/usr/local/lib/gstreamer-1.0-host:ro
      - /usr/lib/aarch64-linux-gnu/libx264.so.163:/usr/lib/aarch64-linux-gnu/libx264.so.163:ro
    network_mode: host

  heimdall-web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    network_mode: host
    restart: unless-stopped
    environment:
      - HEIMDALL_CONFIG_DIR=/app/config
      - HEIMDALL_LOGS_DIR=/app/logs
      - HEIMDALL_CONTAINER=heimdall
    volumes:
      - ../config:/app/config
      - ../logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    # http://[jetson-ip]:8080

  mediamtx:
    image: bluenviron/mediamtx:latest
    network_mode: host
    restart: unless-stopped

  replay:
    build:
      context: ..
      dockerfile: docker/Dockerfile.replay
    volumes:
      - ../recordings:/recordings
      - ../config:/app/config
      - ../logs:/app/logs
    # Usage: docker compose run --rm replay <recording.jsonl> /app/config <output.jsonl>

volumes:
  heimdall-data:
